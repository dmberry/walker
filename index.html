<body>
<p><span class="n">WALKER</span><br><a id="go" href="tools/world-preview.html">enter</a></p>

<script>
// GITHUB PAGES SENDS cache-control: max-age=600, and a real header beats the
// <meta http-equiv> the game page carries — browsers largely ignore that meta
// anyway. So for ten minutes after every push, both the browser and the Fastly
// edge keep serving the old build.
//
// A query string is a different cache key, so this always fetches the current
// file. This page is 1 KB and its own ten-minute cache costs nothing; the game
// page is the one that has to be fresh.
var url = 'tools/world-preview.html?v=' + Date.now();
document.getElementById('go').href = url;
location.replace(url);
</script>
